<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Safe restore validation flow</title>
  <desc id="desc">Read the whole file, verify the checksum, parse and bounds-check into a new dictionary, then swap the live reference under one lock. Any earlier failure leaves live data unchanged.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#756F62"/>
    </marker>
    <marker id="arrow-clay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#AD6047"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D7D7C5"/>
    </marker>
  </defs>

  <rect width="1120" height="620" rx="8" fill="#F7F2E8"/>
  <text x="56" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#292720">Restoring a snapshot safely</text>
  <text x="56" y="84" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#756F62">validate everything, build a new dictionary, then make one swap</text>
  <line x1="56" y1="104" x2="1064" y2="104" stroke="#D8CEBD" stroke-width="1"/>

  <text x="56" y="136" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.3" fill="#978F80">VALIDATE INTO A NEW DICTIONARY</text>
  <text x="872" y="136" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.3" fill="#978F80">COMMIT</text>

  <!-- Steps 1-4 -->
  <g>
    <rect x="56" y="150" width="184" height="112" rx="3" fill="#FBF8F1" stroke="#D8CEBD"/>
    <text x="70" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#AD6047">01</text>
    <text x="70" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#292720">Read whole file</text>
    <text x="70" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">one read_bytes() call</text>
    <text x="70" y="236" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">into memory</text>
  </g>
  <g>
    <rect x="260" y="150" width="184" height="112" rx="3" fill="#FBF8F1" stroke="#D8CEBD"/>
    <text x="274" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#AD6047">02</text>
    <text x="274" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#292720">Verify SHA-256</text>
    <text x="274" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">before any length</text>
    <text x="274" y="236" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">is trusted</text>
  </g>
  <g>
    <rect x="464" y="150" width="184" height="112" rx="3" fill="#FBF8F1" stroke="#D8CEBD"/>
    <text x="478" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#AD6047">03</text>
    <text x="478" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#292720">Parse + bounds</text>
    <text x="478" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">magic · version · count</text>
    <text x="478" y="236" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">every length checked</text>
  </g>
  <g>
    <rect x="668" y="150" width="184" height="112" rx="3" fill="#FBF8F1" stroke="#D8CEBD"/>
    <text x="682" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#AD6047">04</text>
    <text x="682" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#292720">Build new dict</text>
    <text x="682" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">UTF-8 · duplicate keys</text>
    <text x="682" y="236" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">rejected</text>
  </g>

  <line x1="240" y1="206" x2="254" y2="206" stroke="#756F62" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="444" y1="206" x2="458" y2="206" stroke="#756F62" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="648" y1="206" x2="662" y2="206" stroke="#756F62" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <g>
    <rect x="872" y="150" width="184" height="112" rx="3" fill="#59624E" stroke="#4F5744"/>
    <text x="886" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#C8C9B2">05</text>
    <text x="886" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#F7F2E8">Swap under lock</text>
    <text x="886" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#D7D7C5">store.replace_all()</text>
    <text x="886" y="236" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#D7D7C5">one reference change</text>
  </g>

  <!-- Abort rail -->
  <g stroke="#AD6047" stroke-width="1.1" stroke-dasharray="4 4">
    <line x1="148" y1="262" x2="148" y2="320" marker-end="url(#arrow-clay)"/>
    <line x1="352" y1="262" x2="352" y2="320" marker-end="url(#arrow-clay)"/>
    <line x1="556" y1="262" x2="556" y2="320" marker-end="url(#arrow-clay)"/>
    <line x1="760" y1="262" x2="760" y2="320" marker-end="url(#arrow-clay)"/>
  </g>
  <rect x="56" y="326" width="796" height="62" rx="3" fill="#F0DFD5" stroke="#D8BCA8"/>
  <text x="454" y="351" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#914C37">any failure here stops the restore — the live store is never touched</text>
  <text x="454" y="371" text-anchor="middle" font-family="Consolas, 'Cascadia Code', monospace" font-size="9.5" fill="#914C37">SnapshotCorrupt / ValidationError → HTTP 422</text>

  <!-- Success path -->
  <line x1="964" y1="262" x2="964" y2="326" stroke="#59624E" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="974" y="300" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#59624E">one swap</text>

  <g>
    <rect x="872" y="332" width="184" height="150" rx="3" fill="#FBF8F1" stroke="#59624E"/>
    <text x="888" y="358" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1.2" fill="#59624E">LIVE STORE</text>
    <text x="888" y="384" font-family="Consolas, 'Cascadia Code', monospace" font-size="11" fill="#292720">_data</text>
    <text x="888" y="408" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">readers see the old or</text>
    <text x="888" y="424" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">the new dictionary,</text>
    <text x="888" y="440" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">never a half state</text>
    <text x="888" y="466" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-style="italic" fill="#59624E">the new state is live</text>
  </g>

  <!-- Bottom notes -->
  <text x="56" y="530" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#756F62">Validation and parsing happen outside the store lock. The lock is held only for the final reference swap.</text>
  <text x="56" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" font-style="italic" fill="#292720">A failed restore never partially modifies live data.</text>
  <text x="56" y="588" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#978F80">Restore is a rollback, not a merge: keys absent from the snapshot disappear when the new state is committed.</text>
</svg>
