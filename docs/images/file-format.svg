<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-labelledby="title desc">
  <title id="title">KVSN version 1 snapshot file format</title>
  <desc id="desc">A 12-byte header with magic, version, padding and entry count, followed by length-prefixed entries and a 32-byte SHA-256 trailer.</desc>

  <rect width="1120" height="620" rx="8" fill="#F7F2E8"/>
  <text x="56" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#292720">Snapshot file format — KVSN v1</text>
  <text x="56" y="84" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#756F62">big-endian · length-prefixed · SHA-256 checked</text>
  <line x1="56" y1="104" x2="1064" y2="104" stroke="#D8CEBD" stroke-width="1"/>

  <!-- offsets -->
  <g font-family="Consolas, 'Cascadia Code', monospace" font-size="9" fill="#978F80">
    <text x="56" y="142">0</text>
    <text x="172" y="142">4</text>
    <text x="248" y="142">5</text>
    <text x="332" y="142">8</text>
    <text x="448" y="142">12</text>
    <text x="868" y="142">end−32</text>
    <text x="1064" y="142" text-anchor="end">end</text>
  </g>
  <g stroke="#BFB3A0" stroke-width="1">
    <line x1="56" y1="148" x2="56" y2="160"/>
    <line x1="172" y1="148" x2="172" y2="160"/>
    <line x1="248" y1="148" x2="248" y2="160"/>
    <line x1="332" y1="148" x2="332" y2="160"/>
    <line x1="448" y1="148" x2="448" y2="160"/>
    <line x1="868" y1="148" x2="868" y2="160"/>
    <line x1="1064" y1="148" x2="1064" y2="160"/>
  </g>

  <!-- File strip -->
  <g stroke-width="1">
    <rect x="56" y="160" width="116" height="84" fill="#E4E7DA" stroke="#BFC5AE"/>
    <rect x="172" y="160" width="76" height="84" fill="#E4E7DA" stroke="#BFC5AE"/>
    <rect x="248" y="160" width="84" height="84" fill="#E4E7DA" stroke="#BFC5AE"/>
    <rect x="332" y="160" width="116" height="84" fill="#E4E7DA" stroke="#BFC5AE"/>
    <rect x="448" y="160" width="420" height="84" fill="#F0DFD5" stroke="#D8BCA8"/>
    <rect x="868" y="160" width="196" height="84" fill="#59624E" stroke="#4F5744"/>
  </g>

  <g text-anchor="middle">
    <text x="114" y="189" font-family="Consolas, 'Cascadia Code', monospace" font-size="16" fill="#292720">KVSN</text>
    <text x="114" y="209" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">magic · 4 bytes</text>

    <text x="210" y="189" font-family="Consolas, 'Cascadia Code', monospace" font-size="15" fill="#292720">0x01</text>
    <text x="210" y="209" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">version · 1</text>

    <text x="290" y="189" font-family="Consolas, 'Cascadia Code', monospace" font-size="10" fill="#292720">00 00 00</text>
    <text x="290" y="209" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">reserved · 3</text>

    <text x="390" y="189" font-family="Consolas, 'Cascadia Code', monospace" font-size="10" fill="#292720">00 00 00 03</text>
    <text x="390" y="209" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">entry count · 4</text>

    <text x="658" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#292720">entries</text>
    <text x="658" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">one after another, sorted by key</text>

    <text x="966" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#F7F2E8">SHA-256</text>
    <text x="966" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#D7D7C5">32-byte trailer</text>
  </g>

  <!-- Entry label -->
  <text x="56" y="278" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.3" fill="#978F80">EACH ENTRY — REPEATED FOR EVERY KEY</text>

  <!-- Entry strip -->
  <g stroke-width="1">
    <rect x="56" y="292" width="150" height="72" fill="#E4E7DA" stroke="#BFC5AE"/>
    <rect x="206" y="292" width="170" height="72" fill="#E4E7DA" stroke="#BFC5AE"/>
    <rect x="376" y="292" width="320" height="72" fill="#FBF8F1" stroke="#D8CEBD"/>
    <rect x="696" y="292" width="368" height="72" fill="#FBF8F1" stroke="#D8CEBD"/>
  </g>
  <g text-anchor="middle">
    <text x="131" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#292720">key length</text>
    <text x="131" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">2 bytes</text>

    <text x="291" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#292720">value length</text>
    <text x="291" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">4 bytes</text>

    <text x="536" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#292720">key bytes</text>
    <text x="536" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">UTF-8 · 1–256 bytes</text>

    <text x="880" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#292720">value bytes</text>
    <text x="880" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#756F62">UTF-8 · 0–64 KiB</text>
  </g>

  <!-- Notes -->
  <line x1="366" y1="402" x2="366" y2="490" stroke="#E2D8C8" stroke-width="1"/>
  <line x1="696" y1="402" x2="696" y2="490" stroke="#E2D8C8" stroke-width="1"/>
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#756F62">
    <text x="56" y="416" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#292720">Byte order</text>
    <text x="56" y="438">Every integer is big-endian (network order),</text>
    <text x="56" y="454">so the file does not depend on the machine</text>
    <text x="56" y="470">that wrote it.</text>

    <text x="386" y="416" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#292720">Integrity</text>
    <text x="386" y="438">SHA-256 covers the header and every entry.</text>
    <text x="386" y="454">The last 32 bytes are the digest itself; it</text>
    <text x="386" y="470">is not encryption and not a signature.</text>

    <text x="716" y="416" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#292720">Before parsing</text>
    <text x="716" y="438">The reader verifies the digest first, then</text>
    <text x="716" y="454">checks magic, version, count, every length,</text>
    <text x="716" y="470">UTF-8, duplicate keys, and trailing bytes.</text>
  </g>

  <!-- Hex example -->
  <text x="56" y="518" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1.3" fill="#978F80">A SMALL FILE IN HEX</text>
  <rect x="56" y="528" width="1008" height="42" rx="2" fill="#EFE8DA" stroke="#D8CEBD"/>
  <text x="76" y="554" font-family="Consolas, 'Cascadia Code', monospace" font-size="11.5" fill="#756F62">4B 56 53 4E  01 00 00 00  00 00 00 03  … entry bytes …  SHA-256 digest (32 bytes)</text>

  <text x="56" y="600" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#756F62">A corrupted length is never trusted: the checksum gate runs before the entry parser.</text>
</svg>
